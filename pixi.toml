[workspace]
authors = ["James McDuffie <409331+omwah@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "solar-node-wifi"
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[tasks]
build = { cmd = "pio run -e xiao_esp32c3", description = "Build the XIAO ESP32-C3 firmware" }
test = { cmd = "pio test -e native", description = "Run host unit tests (T1)" }
driver-test = { cmd = "test/driver_harness/run.sh", description = "Run the stock Meshtastic SENxx driver against the emulator (T2)" }
flash = { cmd = "pio run -e xiao_esp32c3 -t upload", description = "Flash the firmware over USB" }
flash-phase0 = { cmd = "pio run -e xiao_esp32c3_phase0 -t upload", description = "Flash the Phase 0 bench build (fixed test values)" }
monitor = { cmd = "pio device monitor -e xiao_esp32c3", description = "Open the USB serial console" }
clean = { cmd = "pio run -t clean", description = "Remove build outputs" }
configure = { cmd = "python tools/configure.py", description = "Configure the bridge over USB serial" }
remote = { cmd = "python tools/remote.py", description = "Manage a deployed bridge over MQTT" }
test-tools = { cmd = "pytest -q test/tools", description = "Unit tests for the host tools" }
power-budget = { cmd = "python tools/power_budget.py", description = "Monthly harvest vs. load and storm autonomy" }

[dependencies]
python = "3.12.*"
platformio = ">=6.2.0,<7"
pip = ">=26.2.1,<27"
pyserial = ">=3.5,<4"
paho-mqtt = ">=2.1.0,<3"
pytest = ">=9.1.1,<10"

# Host compiler for the native test env; macOS uses the system clang.
[target.linux-64.dependencies]
gcc = ">=16.2.0,<16.3"
gxx = ">=16.2.0,<16.3"

# T3 bench tools in their own environment: the Meshtastic Python API needs a newer
# tabulate than PlatformIO allows.
[feature.bench.dependencies]
python = "3.12.*"
paho-mqtt = ">=2.1.0,<3"
pytest = ">=9.1.1,<10"
jinja2 = ">=3.1,<4"
pyyaml = ">=6,<7"

[feature.bench.target.linux-64.dependencies]
mosquitto = ">=2.0.20,<3"

[feature.bench.pypi-dependencies]
meshtastic = ">=2.7,<3"

[feature.bench.tasks]
broker = { cmd = "$CONDA_PREFIX/sbin/mosquitto -c test/bench/mosquitto.conf", description = "Local broker for the bench (T3)" }
publish = { cmd = "python test/bench/publisher.py", description = "Synthetic HA publisher (T3)" }
receive = { cmd = "python test/bench/receiver.py", description = "Check AirQualityMetrics arriving over the mesh (T3)" }
test-bench = { cmd = "pytest -q test/bench", description = "Broker-backed tests of the host tools and publisher" }

[environments]
bench = { features = ["bench"], no-default-feature = true }

