[platformio]
default_envs = xiao_esp32c3

[env]
lib_deps = bblanchon/ArduinoJson @ 7.4.3

[env:xiao_esp32c3]
platform = platformio/espressif32 @ 7.1.3
board = seeed_xiao_esp32c3
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_ignore = native/*

; Phase 0 bench build: serves fixed test values (docs/PLAN.md §7)
[env:xiao_esp32c3_phase0]
extends = env:xiao_esp32c3
build_flags = -DBRIDGE_FIXED_TEST_VALUES

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -Werror
test_filter = native/*
